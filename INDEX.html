<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>ZeiikBet — Value Bets Coupe du Monde 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
  :root{--bg:#04060f;--surface:#0c1120;--border:#1a2236;--accent:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--text:#f1f5f9;--muted:#64748b;--dim:#1e293b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .header{background:#0c1120;border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
  .header-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
  .logo{font-size:19px;font-weight:900;letter-spacing:-.03em}
  .logo span{color:var(--accent)}
  .badge{font-size:10px;background:#22c55e18;color:var(--green);font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid #22c55e33;margin-left:6px}
  .tabs{display:flex;max-width:560px;margin:0 auto}
  .tab{flex:1;padding:9px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;text-align:center;transition:all .15s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:800}
  .main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .hcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 6px;text-align:center}
  .hnum{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1}
  .hlbl{font-size:9px;color:var(--muted);margin-top:3px;font-weight:600}
  .sec{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;margin-top:4px}
  .sec::after{content:'';flex:1;height:1px;background:var(--border)}
  .vb-strip{background:linear-gradient(135deg,#052e1633,#14532d22);border:1px solid #16a34a44;border-radius:14px;padding:13px;margin-bottom:16px;display:flex;flex-direction:column;gap:9px}
  .vb-item{background:#020917;border-radius:10px;padding:11px 12px;border-left:3px solid var(--green)}
  .bar{width:100%;background:var(--dim);border-radius:3px;overflow:hidden}
  .bar-fill{border-radius:3px;transition:width .8s}
  .mcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden}
  .mcard.vb{border-color:#16a34a33}
  .mheader{padding:12px 14px;cursor:pointer}
  .bets-panel{border-top:1px solid var(--border);padding:11px 13px;display:flex;flex-direction:column;gap:7px}
  .bet-row{background:#020917;border-radius:9px;padding:9px 11px}
  .bet-row.vb{border:1px solid #16a34a33}
  .scan-btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;margin-bottom:10px;transition:opacity .2s}
  .scan-btn:disabled{background:var(--surface);color:var(--muted);cursor:not-allowed}
  .prog-bar{background:var(--dim);border-radius:4px;height:6px;overflow:hidden;margin-bottom:12px}
  .prog-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6);border-radius:4px;transition:width .4s}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .fpill{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
  .fpill.active{background:#3b82f622;border-color:#3b82f6;color:#3b82f6}
  .empty{text-align:center;padding:50px 20px}
  .footer{text-align:center;font-size:11px;color:#1e293b;padding:10px 20px 30px;line-height:1.6}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .spin{animation:spin .8s linear infinite;display:inline-block;width:16px;height:16px;border:2px solid #334155;border-top-color:#fff;border-radius:50%}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'https://zeiikbot.onrender.com';

const WC = [
  {id:1,home:"Mexique",away:"Afrique du Sud",comp:"Coupe du Monde",group:"Groupe A",flag:"🏆",date:"2026-06-11",time:"21h00",type:"wc"},
  {id:2,home:"Corée du Sud",away:"Rép. tchèque",comp:"Coupe du Monde",group:"Groupe A",flag:"🏆",date:"2026-06-12",time:"04h00",type:"wc"},
  {id:3,home:"Canada",away:"Bosnie-Herzégovine",comp:"Coupe du Monde",group:"Groupe B",flag:"🏆",date:"2026-06-12",time:"21h00",type:"wc"},
  {id:4,home:"États-Unis",away:"Paraguay",comp:"Coupe du Monde",group:"Groupe D",flag:"🏆",date:"2026-06-13",time:"03h00",type:"wc"},
  {id:5,home:"Qatar",away:"Suisse",comp:"Coupe du Monde",group:"Groupe B",flag:"🏆",date:"2026-06-13",time:"21h00",type:"wc"},
  {id:6,home:"Brésil",away:"Maroc",comp:"Coupe du Monde",group:"Groupe C",flag:"🏆",date:"2026-06-14",time:"00h00",type:"wc"},
  {id:7,home:"Haïti",away:"Écosse",comp:"Coupe du Monde",group:"Groupe C",flag:"🏆",date:"2026-06-14",time:"03h00",type:"wc"},
  {id:8,home:"Australie",away:"Turquie",comp:"Coupe du Monde",group:"Groupe D",flag:"🏆",date:"2026-06-14",time:"06h00",type:"wc"},
  {id:9,home:"Allemagne",away:"Curaçao",comp:"Coupe du Monde",group:"Groupe E",flag:"🏆",date:"2026-06-14",time:"19h00",type:"wc"},
  {id:10,home:"Pays-Bas",away:"Japon",comp:"Coupe du Monde",group:"Groupe F",flag:"🏆",date:"2026-06-14",time:"22h00",type:"wc"},
  {id:11,home:"Côte d'Ivoire",away:"Équateur",comp:"Coupe du Monde",group:"Groupe E",flag:"🏆",date:"2026-06-15",time:"01h00",type:"wc"},
  {id:12,home:"Suède",away:"Tunisie",comp:"Coupe du Monde",group:"Groupe F",flag:"🏆",date:"2026-06-15",time:"04h00",type:"wc"},
  {id:13,home:"Espagne",away:"Cap-Vert",comp:"Coupe du Monde",group:"Groupe H",flag:"🏆",date:"2026-06-15",time:"18h00",type:"wc"},
  {id:14,home:"Arabie Saoudite",away:"Uruguay",comp:"Coupe du Monde",group:"Groupe H",flag:"🏆",date:"2026-06-15",time:"21h00",type:"wc"},
  {id:15,home:"Belgique",away:"Égypte",comp:"Coupe du Monde",group:"Groupe G",flag:"🏆",date:"2026-06-16",time:"18h00",type:"wc"},
  {id:16,home:"France",away:"Sénégal",comp:"Coupe du Monde",group:"Groupe I",flag:"🏆",date:"2026-06-16",time:"21h00",type:"wc"},
  {id:17,home:"Iran",away:"Nouvelle-Zélande",comp:"Coupe du Monde",group:"Groupe G",flag:"🏆",date:"2026-06-16",time:"21h00",type:"wc"},
  {id:18,home:"Argentine",away:"Algérie",comp:"Coupe du Monde",group:"Groupe J",flag:"🏆",date:"2026-06-17",time:"21h00",type:"wc"},
  {id:19,home:"Portugal",away:"Ouzbékistan",comp:"Coupe du Monde",group:"Groupe K",flag:"🏆",date:"2026-06-17",time:"18h00",type:"wc"},
  {id:20,home:"Angleterre",away:"Colombie",comp:"Coupe du Monde",group:"Groupe L",flag:"🏆",date:"2026-06-18",time:"21h00",type:"wc"},
  {id:21,home:"Croatie",away:"Panama",comp:"Coupe du Monde",group:"Groupe K",flag:"🏆",date:"2026-06-18",time:"18h00",type:"wc"},
  {id:22,home:"Mexique",away:"Corée du Sud",comp:"Coupe du Monde",group:"Groupe A",flag:"🏆",date:"2026-06-19",time:"21h00",type:"wc"},
  {id:23,home:"Pays-Bas",away:"Suède",comp:"Coupe du Monde",group:"Groupe F",flag:"🏆",date:"2026-06-20",time:"21h00",type:"wc"},
  {id:24,home:"Allemagne",away:"Côte d'Ivoire",comp:"Coupe du Monde",group:"Groupe E",flag:"🏆",date:"2026-06-20",time:"18h00",type:"wc"},
  {id:25,home:"Brésil",away:"Haïti",comp:"Coupe du Monde",group:"Groupe C",flag:"🏆",date:"2026-06-21",time:"21h00",type:"wc"},
  {id:26,home:"France",away:"Irak",comp:"Coupe du Monde",group:"Groupe I",flag:"🏆",date:"2026-06-22",time:"23h00",type:"wc"},
  {id:27,home:"Espagne",away:"Arabie Saoudite",comp:"Coupe du Monde",group:"Groupe H",flag:"🏆",date:"2026-06-22",time:"21h00",type:"wc"},
];

const FRIENDLY = [
  {id:100,home:"Italie",away:"Pays-Bas",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-10",time:"20h45",type:"friendly"},
  {id:101,home:"Suisse",away:"Autriche",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-10",time:"18h00",type:"friendly"},
  {id:102,home:"Danemark",away:"Serbie",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-11",time:"19h00",type:"friendly"},
  {id:103,home:"Allemagne",away:"Pologne",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-11",time:"20h45",type:"friendly"},
  {id:104,home:"Espagne",away:"Andorre",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-12",time:"21h00",type:"friendly"},
  {id:105,home:"Portugal",away:"Irlande",comp:"Amical International",group:"Amical",flag:"🤝",date:"2026-06-13",time:"20h45",type:"friendly"},
];

const ALL = [...WC, ...FRIENDLY];
const gc = v => v>=78?'#22c55e':v>=62?'#f59e0b':'#ef4444';
const todayKey = () => new Date().toISOString().slice(0,10);
const todayLabel = () => new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const CACHE = 'zb_cache_';
const CDATE = 'zb_date_';

let state = { tab:'today', filter:'all', scanning:false, progress:{done:0,total:0}, results:[], expanded:null, done:false };
const setState = p => { state={...state,...p}; render(); };

function getMatches(t) {
  const today = todayKey();
  if(t==='today') return ALL.filter(m=>m.date===today);
  if(t==='wc') return WC;
  if(t==='friendly') return FRIENDLY;
  return ALL;
}

async function analyzeMatch(m) {
  const r = await fetch(API+'/analyze', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({home:m.home,away:m.away,comp:m.comp,group:m.group,type:m.type})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

async function runScan() {
  const matches = getMatches(state.tab);
  if(!matches.length) return;
  setState({scanning:true,done:false,results:[],progress:{done:0,total:matches.length}});
  const res = [];
  for(let i=0;i<matches.length;i++) {
    const m = matches[i];
    try {
      const a = await analyzeMatch(m);
      if(a && a.bets) res.push({...m,a});
      else res.push({...m,a:null});
    } catch { res.push({...m,a:null}); }
    setState({results:[...res],progress:{done:i+1,total:matches.length}});
    await new Promise(r=>setTimeout(r,200));
  }
  const valid = res.filter(r=>r.a);
  localStorage.setItem(CACHE+state.tab, JSON.stringify(valid));
  localStorage.setItem(CDATE+state.tab, todayKey());
  setState({scanning:false,done:true,results:valid});
}

function bar(v,h=5){return`<div class="bar" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(v,100)}%;height:${h}px;background:${gc(v)}"></div></div>`}

function render() {
  const {tab,filter,scanning,progress,results,expanded,done} = state;
  const valid = results.filter(r=>r.a);
  let sorted = [...valid].sort((a,b)=>b.a.globalConfidence-a.a.globalConfidence);
  if(filter==='value') sorted=sorted.filter(r=>r.a.bets?.some(b=>b.isValue));
  if(filter==='high') sorted=sorted.filter(r=>r.a.globalConfidence>=75);
  const allVBs = sorted.flatMap(r=>(r.a.bets?.filter(b=>b.isValue)||[]).map(b=>({...b,match:r})));
  const pct = progress.total?Math.round(progress.done/progress.total*100):0;
  const matchesForTab = getMatches(tab);

  document.getElementById('app').innerHTML = `
  <div class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:20px">⚽</span>
        <span class="logo">Zeiik<span>Bet</span></span>
        ${valid.length?'<span class="badge">LIVE</span>':''}
      </div>
      <div style="font-size:11px;color:var(--muted)">${todayLabel()}</div>
    </div>
    <div class="tabs">
      ${[['today',"📅 Aujourd'hui"],['wc',"🏆 Coupe du Monde"],['friendly',"🤝 Amicaux"]].map(([id,l])=>
        `<button class="tab ${tab===id?'active':''}" onclick="changeTab('${id}')">${l}</button>`
      ).join('')}
    </div>
  </div>

  <div class="main">
    ${valid.length?`
    <div class="hero">
      <div class="hcard"><div class="hnum" style="color:#22c55e">${allVBs.length}</div><div class="hlbl">Value Bets</div></div>
      <div class="hcard"><div class="hnum" style="color:#3b82f6">${sorted.filter(r=>r.a.globalConfidence>=75).length}</div><div class="hlbl">≥75%</div></div>
      <div class="hcard"><div class="hnum" style="color:#6366f1">${valid.length}</div><div class="hlbl">Analysés</div></div>
      <div class="hcard"><div class="hnum" style="color:#f59e0b">${matchesForTab.length}</div><div class="hlbl">Matchs</div></div>
    </div>`:''}

    <button class="scan-btn" onclick="runScan()" ${scanning||!matchesForTab.length?'disabled':''}>
      ${scanning?`<div class="spin"></div>Analyse ${progress.done}/${progress.total}…`:done?'🔄 Réanalyser':`🚀 Analyser ${matchesForTab.length} match${matchesForTab.length>1?'s':''}`}
    </button>
    ${scanning?`<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>`:''}

    ${allVBs.length?`
    <div class="sec">🔥 Value Bets détectés</div>
    <div class="vb-strip">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px">🔥</span>
        <span style="font-size:13px;font-weight:800;color:#22c55e">Opportunités</span>
        <span style="background:#16a34a44;color:#22c55e;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">${allVBs.length}</span>
      </div>
      ${allVBs.map(b=>`
      <div class="vb-item">
        <div style="font-size:13px;font-weight:800;margin-bottom:2px">${b.match.home} vs ${b.match.away}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:7px">${b.match.flag} ${b.match.comp} · ${b.match.group} · 🕐 ${b.match.time}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:#94a3b8">${b.emoji} ${b.label}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:700;color:#22c55e">${b.prediction}</span>
            <span style="font-size:15px;font-weight:700;color:${gc(b.confidence)}">${b.confidence}%</span>
          </div>
        </div>
        ${b.valueReason?`<div style="font-size:11px;color:#4ade8066;margin-top:5px;line-height:1.4">💡 ${b.valueReason}</div>`:''}
        <div style="margin-top:6px">${bar(b.confidence,4)}</div>
      </div>`).join('')}
    </div>`:''}

    ${sorted.length?`
    <div class="sec">📊 Matchs analysés</div>
    <div style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap">
      ${[['all','Tous'],['high','🎯 ≥75%'],['value','🔥 Value']].map(([id,l])=>
        `<button class="fpill ${filter===id?'active':''}" onclick="setFilter('${id}')">${l}</button>`
      ).join('')}
    </div>
    ${sorted.map(r=>{
      const hasV=r.a.bets?.some(b=>b.isValue);
      const isExp=expanded===r.id;
      const rc=r.a.riskLevel==='FAIBLE'?'#22c55e':r.a.riskLevel==='MOYEN'?'#f59e0b':'#ef4444';
      return`<div class="mcard ${hasV?'vb':''}">
        <div class="mheader" onclick="toggleExpand(${r.id})">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">
            <div style="flex:1;min-width:0">
              <div style="font-size:10px;color:var(--muted);margin-bottom:3px">${r.flag} ${r.comp} · ${r.group} · 🕐 ${r.time}</div>
              <div style="font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.home} <span style="color:var(--dim);font-weight:400">vs</span> ${r.away}</div>
              ${r.a.bestBet?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${r.a.bestBet.label} → <strong style="color:${gc(r.a.bestBet.confidence)}">${r.a.bestBet.confidence}%</strong></div>`:''}
              <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
                ${hasV?`<span class="tag" style="background:#16a34a22;color:#22c55e;border:1px solid #16a34a33">🔥 VALUE</span>`:''}
                ${r.a.globalConfidence>=75?`<span class="tag" style="background:#3b82f622;color:#3b82f6;border:1px solid #3b82f633">🎯 ≥75%</span>`:''}
                ${r.type==='wc'?`<span class="tag" style="background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b33">🏆 CDM</span>`:''}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:26px;font-weight:700;color:${gc(r.a.globalConfidence)};line-height:1">${r.a.globalConfidence}%</div>
              <div style="font-size:9px;color:var(--muted);margin-top:1px">GLOBAL</div>
              <div style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-top:3px;color:${rc};background:${rc}18;display:inline-block">${r.a.riskLevel}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1">${bar(r.a.globalConfidence)}</div>
            <span style="font-size:11px;color:var(--dim);transition:transform .2s;transform:${isExp?'rotate(180deg)':'none'}">▼</span>
          </div>
        </div>
        ${isExp?`<div class="bets-panel">
          ${r.a.summary?`<div style="background:#020917;border-radius:8px;padding:9px 11px;font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:4px">🧠 ${r.a.summary}</div>`:''}
          ${r.a.bets?.map(b=>`
          <div class="bet-row ${b.isValue?'vb':''}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:#94a3b8">
                ${b.emoji} ${b.label}
                ${b.isValue?`<span style="font-size:10px;background:#16a34a22;color:#22c55e;font-weight:700;padding:1px 7px;border-radius:10px;border:1px solid #16a34a33">VALUE</span>`:''}
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:11px;color:var(--muted)">${b.prediction}</span>
                <span style="font-size:14px;font-weight:700;color:${gc(b.confidence)}">${b.confidence}%</span>
              </div>
            </div>
            ${bar(b.confidence,4)}
            ${b.isValue&&b.valueReason?`<div style="font-size:10px;color:#4ade8055;margin-top:4px;line-height:1.4">💡 ${b.valueReason}</div>`:''}
          </div>`).join('')}
        </div>`:''}
      </div>`;
    }).join('')}`:''}

    ${!scanning&&!valid.length?`<div class="empty">
      <div style="font-size:48px;margin-bottom:12px">${tab==='wc'?'🏆':tab==='friendly'?'🤝':'📅'}</div>
      <div style="font-size:14px;font-weight:700;color:#334155;margin-bottom:6px">${matchesForTab.length?'Prêt à analyser':'Aucun match aujourd\'hui'}</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.5">${matchesForTab.length?`${matchesForTab.length} match${matchesForTab.length>1?'s':''} disponible${matchesForTab.length>1?'s':''}. Lance l'analyse.`:'Consulte les onglets Coupe du Monde ou Amicaux.'}</div>
    </div>`:''}
  </div>

  <div class="footer">⚠️ Prédictions IA à titre informatif · Jouez responsable · ZeiikBet © 2026</div>
  `;
}

window.changeTab = t => setState({tab:t,results:[],done:false,filter:'all'});
window.setFilter = f => setState({filter:f});
window.toggleExpand = id => setState({expanded:state.expanded===id?null:id});
window.runScan = runScan;

render();
// Auto-load cache
const cached=localStorage.getItem(CACHE+state.tab);
const date=localStorage.getItem(CDATE+state.tab);
if(cached&&date===todayKey()) setState({results:JSON.parse(cached),done:true});
</script>
</body>
</html>
