<style>

  :root { --bg:#04060f;--surface:#0c1120;--border:#1a2236;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--text:#f1f5f9;--muted:#64748b;--dim:#1e293b; }
  *{box-sizing:border-box;margin:0;padding:0} html{background:var(--bg)} body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  .header{background:linear-gradient(180deg,#0c1120 0%,transparent 100%);padding:18px 16px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .header-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo-text{font-size:20px;font-weight:900;letter-spacing:-0.03em}
  .logo-text span{color:var(--accent)}
  .logo-badge{font-size:10px;background:#22c55e18;color:var(--green);font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid #22c55e33;letter-spacing:.06em}
  .tabs{display:flex;gap:0;max-width:560px;margin:0 auto}
  .tab{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;transition:all .15s;letter-spacing:.02em;font-family:'Inter',sans-serif}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:800}
  .main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
  .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
  .hero-num{font-size:24px;font-weight:900;line-height:1;font-family:'JetBrains Mono',monospace}
  .hero-label{font-size:9px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:.05em}
  .section-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;margin-top:4px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .vb-strip{background:linear-gradient(135deg,#052e1633,#14532d22);border:1px solid #16a34a44;border-radius:14px;padding:14px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
  .vb-item{background:#020917;border-radius:10px;padding:12px 13px;border-left:3px solid var(--green)}
  .vb-match{font-size:13px;font-weight:800;margin-bottom:2px}
  .vb-meta{font-size:11px;color:var(--muted);margin-bottom:8px}
  .vb-bet{display:flex;justify-content:space-between;align-items:center}
  .vb-pred{font-size:12px;font-weight:700;color:var(--green)}
  .vb-conf{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
  .vb-reason{font-size:11px;color:#4ade8066;margin-top:5px;line-height:1.4}
  .match-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden;transition:border-color .2s}
  .match-card.has-value{border-color:#16a34a33}
  .match-header{padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:9px}
  .match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .match-league{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:4px}
  .match-teams{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .match-teams .sep{color:var(--dim);font-weight:400;margin:0 5px}
  .match-best{font-size:11px;color:var(--muted);margin-top:3px}
  .conf-big{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;line-height:1;text-align:right}
  .conf-label{font-size:9px;color:var(--muted);margin-top:1px;letter-spacing:.06em;text-align:right}
  .risk-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-top:3px}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .tag.value{background:#16a34a22;color:var(--green);border:1px solid #16a34a33}
  .tag.high{background:#3b82f622;color:var(--accent);border:1px solid #3b82f633}
  .tag.wc{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b33}
  .bar-wrap{width:100%;background:var(--dim);border-radius:4px;overflow:hidden}
  .bar-fill{border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
  .bets-panel{border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
  .summary-box{background:#020917;border-radius:8px;padding:9px 11px;font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:2px}
  .bet-row{background:#020917;border-radius:10px;padding:10px 12px}
  .bet-row.is-value{border:1px solid #16a34a33}
  .bet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .bet-left{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
  .bet-right{display:flex;align-items:center;gap:8px}
  .bet-conf{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}
  .bet-reason{font-size:11px;color:#4ade8055;margin-top:5px;line-height:1.4}
  .scan-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .1s;font-family:'Inter',sans-serif;margin-bottom:14px}
  .scan-btn:active{transform:scale(.98)}
  .scan-btn:disabled{background:var(--surface);color:var(--muted);cursor:not-allowed;transform:none}
  .progress-bar{background:var(--dim);border-radius:4px;height:6px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),#8b5cf6);border-radius:4px;transition:width .4s}
  .spin{animation:spin .8s linear infinite;display:inline-block;width:16px;height:16px;border:2px solid #334155;border-top-color:#fff;border-radius:50%}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .3s ease both}
  .empty{text-align:center;padding:50px 20px;color:var(--dim)}
  .empty-icon{font-size:50px;margin-bottom:12px}
  .empty-title{font-size:15px;font-weight:700;color:#334155;margin-bottom:6px}
  .empty-sub{font-size:12px;color:var(--dim);line-height:1.5}
  .footer{text-align:center;font-size:11px;color:#1e293b;padding:10px 20px 30px;line-height:1.6}
  .chevron{transition:transform .2s;color:var(--dim);font-size:11px;flex-shrink:0}
  .chevron.open{transform:rotate(180deg)}
  .modal-bg{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
  .modal input{width:100%;background:#020917;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif}
  .modal-skip{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:10px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;width:100%}
  .step-item{display:flex;gap:10px;align-items:flex-start}
  .step-num{min-width:22px;height:22px;background:#3b82f622;color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
  .step-text{font-size:12px;color:var(--muted);line-height:1.5}
  .filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .filter-pill{background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
  .filter-pill.active{background:#3b82f622;border-color:var(--accent);color:var(--accent)}
</style>
</head>

const gc = v => v>=78?'#22c55e':v>=62?'#f59e0b':'#ef4444';
const todayKey = () => new Date().toISOString().slice(0,10);
const todayLabel = () => new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const formatDate = d => new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

function bar(v,h=5){return`<div class="bar-wrap" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(v,100)}%;height:${h}px;background:${gc(v)}"></div></div>`}
function formB(f){const c={V:'#22c55e',N:'#f59e0b',D:'#ef4444','?':'#475569'};return f.split('').map(x=>`<span style="background:${c[x]||'#475569'}18;color:${c[x]||'#475569'};font-weight:700;font-size:10px;padding:1px 5px;border-radius:4px">${x}</span>`).join(' ')}

let state = {
  tab: 'today',
  scanning: false,
  progress: {done:0,total:0},
  results: [],
  expanded: null,
  key: localStorage.getItem(ANTHROPIC_KEY)||'',
  showModal: !localStorage.getItem(ANTHROPIC_KEY),
  filter: 'all',
};
function setState(p){state={...state,...p};render()}

// Get matches for selected tab
function getMatches(tab){
  const today = todayKey();
  if(tab==='today') return ALL_MATCHES.filter(m=>m.date===today);
  if(tab==='wc') return ALL_MATCHES.filter(m=>m.type==='wc');
  if(tab==='friendly') return ALL_MATCHES.filter(m=>m.type==='friendly');
  return ALL_MATCHES;
}

async function analyzeMatch(m){
  const prompt=`Analyse ce match international de football. Identifie les VALUE BETS avec précision.

Match: ${m.home} vs ${m.away}
Compétition: ${m.comp} ${m.group||''}
Type: ${m.type==='wc'?'Coupe du Monde 2026':'Match amical international'}

Tiens compte du contexte (Coupe du Monde = enjeux élevés, matchs amicaux = moins d'intensité).

Réponds UNIQUEMENT en JSON valide sans markdown:
{"bets":[
{"id":"over15","label":"Over 1.5","emoji":"⚽","prediction":"OUI","confidence":78,"isValue":true,"valueReason":"explication courte"},
{"id":"over25","label":"Over 2.5","emoji":"🔥","prediction":"OUI","confidence":64,"isValue":false,"valueReason":""},
{"id":"btts","label":"BTTS","emoji":"🎯","prediction":"OUI","confidence":69,"isValue":true,"valueReason":"explication courte"},
{"id":"result","label":"Résultat","emoji":"🏆","prediction":"Victoire ${m.home}","confidence":55,"isValue":false,"valueReason":""},
{"id":"dnb","label":"Double chance","emoji":"🛡️","prediction":"${m.home} ou Nul","confidence":72,"isValue":false,"valueReason":""}
],
"bestBet":{"label":"Over 1.5","confidence":78},
"globalConfidence":73,
"riskLevel":"MOYEN",
"summary":"Analyse en une phrase"}`;

  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':state.key,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  const txt=d.content?.map(b=>b.text||'').join('').trim();
  return JSON.parse(txt.replace(/```json|```/g,'').trim());
}

async function runScan(){
  const matches=getMatches(state.tab);
  if(!matches.length)return;

  // Check cache
  const cached=localStorage.getItem(CACHE_KEY+state.tab);
  const cachedDate=localStorage.getItem(CACHE_DATE+state.tab);
  if(cached&&cachedDate===todayKey()){
    setState({results:JSON.parse(cached)});return;
  }

  setState({scanning:true,results:[],progress:{done:0,total:matches.length}});
  const res=[];
  for(let i=0;i<matches.length;i++){
    const m=matches[i];
    try{
      const a=await analyzeMatch(m);
      res.push({...m,a});
    }catch{res.push({...m,a:null});}
    setState({results:[...res],progress:{done:i+1,total:matches.length}});
    await new Promise(r=>setTimeout(r,300));
  }
  const valid=res.filter(r=>r.a);
  localStorage.setItem(CACHE_KEY+state.tab,JSON.stringify(valid));
  localStorage.setItem(CACHE_DATE+state.tab,todayKey());
  setState({scanning:false,results:valid});
}

  if(filter==='high') sorted=sorted.filter(r=>r.a.globalConfidence>=75);
  const allVBs=sorted.flatMap(r=>(r.a.bets?.filter(b=>b.isValue)||[]).map(b=>({...b,match:r})));
  const pct=progress.total?Math.round(progress.done/progress.total*100):0;
  const isToday=localStorage.getItem(CACHE_DATE+tab)===todayKey();
  const matchesForTab=getMatches(tab);

  document.getElementById('app').innerHTML=`

      </div>

    </div>
    <div class="tabs">
      ${[['today','📅 Aujourd\'hui'],['wc','🏆 Coupe du Monde'],['friendly','🤝 Amicaux']].map(([id,label])=>
        `<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`
      ).join('')}
    </div>
  </div>

  <div class="main">
    ${showModal?'':`
    ${valid.length?`
    <div class="hero fade-up">
      <div class="hero-card"><div class="hero-num" style="color:#22c55e">${allVBs.length}</div><div class="hero-label">Value Bets</div></div>
      <div class="hero-card"><div class="hero-num" style="color:var(--accent)">${sorted.filter(r=>r.a.globalConfidence>=75).length}</div><div class="hero-label">≥75%</div></div>
      <div class="hero-card"><div class="hero-num" style="color:var(--accent2)">${valid.length}</div><div class="hero-label">Analysés</div></div>
      <div class="hero-card"><div class="hero-num" style="color:#f59e0b">${matchesForTab.length}</div><div class="hero-label">Matchs</div></div>
    </div>`:''}

    <button class="scan-btn" id="scanBtn" ${scanning||!matchesForTab.length?'disabled':''}>
      ${scanning?`<span class="spin"></span>Analyse ${progress.done}/${progress.total}…`:
        valid.length&&isToday?'🔄 Réanalyser':'🚀 Analyser les matchs'}
    </button>
    ${scanning?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`:''}
    ${isToday&&valid.length?`<div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px">✓ Analyse du jour sauvegardée</div>`:''}

    ${allVBs.length?`
    <div class="section-title">🔥 Value Bets détectés</div>
    <div class="vb-strip fade-up">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <span style="font-size:15px">🔥</span>
        <span style="font-size:13px;font-weight:800;color:var(--green)">Opportunités</span>
        <span style="background:#16a34a44;color:var(--green);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">${allVBs.length}</span>
      </div>
      ${allVBs.map(b=>`
      <div class="vb-item">
        <div class="vb-match">${b.match.home} vs ${b.match.away}</div>
        <div class="vb-meta">${b.match.flag} ${b.match.comp} · ${b.match.group} · 🕐 ${b.match.time}</div>
        <div class="vb-bet">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8">${b.emoji} ${b.label}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="vb-pred">${b.prediction}</span>
            <span class="vb-conf" style="color:${gc(b.confidence)}">${b.confidence}%</span>
          </div>
        </div>
        ${b.valueReason?`<div class="vb-reason">💡 ${b.valueReason}</div>`:''}
        ${bar(b.confidence,4)}
      </div>`).join('')}
    </div>`:''}

    ${sorted.length?`
    <div class="section-title">📊 Matchs analysés</div>
    <div class="filter-row">
      ${[['all','Tous'],['high','🎯 ≥75%'],['value','🔥 Value']].map(([id,label])=>
        `<button class="filter-pill ${filter===id?'active':''}" data-filter="${id}">${label}</button>`
      ).join('')}
    </div>
    ${sorted.map(r=>{
      const hasV=r.a.bets?.some(b=>b.isValue);
      const isExp=expanded===r.id;
      const rc=r.a.riskLevel==='FAIBLE'?'#22c55e':r.a.riskLevel==='MOYEN'?'#f59e0b':'#ef4444';
      return`<div class="match-card ${hasV?'has-value':''} fade-up" data-id="${r.id}">
        <div class="match-header" data-toggle="${r.id}">
          <div class="match-top">
            <div style="flex:1;min-width:0">
              <div class="match-league">${r.flag} ${r.comp} · ${r.group} · 🕐 ${r.time}</div>
              <div class="match-teams">${r.home}<span class="sep">vs</span>${r.away}</div>
              ${r.a.bestBet?`<div class="match-best">${r.a.bestBet.label} → <strong style="color:${gc(r.a.bestBet.confidence)}">${r.a.bestBet.confidence}%</strong></div>`:''}
              <div class="tags">
                ${hasV?`<span class="tag value">🔥 VALUE</span>`:''}
                ${r.a.globalConfidence>=75?`<span class="tag high">🎯 ≥75%</span>`:''}
                ${r.type==='wc'?`<span class="tag wc">🏆 CDM</span>`:''}
              </div>
            </div>
            <div>
              <div class="conf-big" style="color:${gc(r.a.globalConfidence)}">${r.a.globalConfidence}%</div>
              <div class="conf-label">GLOBAL</div>
              <div class="risk-pill" style="color:${rc};background:${rc}18">${r.a.riskLevel}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1">${bar(r.a.globalConfidence)}</div>
            <span class="chevron ${isExp?'open':''}">▼</span>
          </div>
        </div>
        ${isExp?`<div class="bets-panel fade-up">
          ${r.a.summary?`<div class="summary-box">🧠 ${r.a.summary}</div>`:''}
          ${r.a.bets?.map(b=>`
          <div class="bet-row ${b.isValue?'is-value':''}">
            <div class="bet-top">
              <div class="bet-left">${b.emoji} ${b.label}${b.isValue?`<span style="font-size:10px;background:#16a34a22;color:#22c55e;font-weight:700;padding:1px 7px;border-radius:10px;border:1px solid #16a34a33">VALUE</span>`:''}</div>
              <div class="bet-right">
                <span style="font-size:11px;color:var(--muted)">${b.prediction}</span>
                <span class="bet-conf" style="color:${gc(b.confidence)}">${b.confidence}%</span>
              </div>
            </div>
            ${bar(b.confidence,4)}
            ${b.isValue&&b.valueReason?`<div class="bet-reason">💡 ${b.valueReason}</div>`:''}
          </div>`).join('')}
        </div>`:''}
      </div>`}).join('')}`:''}

    ${!scanning&&!valid.length?`<div class="empty">
      <div class="empty-icon">${tab==='wc'?'🏆':tab==='friendly'?'🤝':'📅'}</div>
      <div class="empty-title">${matchesForTab.length?'Prêt à analyser':'Aucun match aujourd\'hui'}</div>
      <div class="empty-sub">${matchesForTab.length?`${matchesForTab.length} match${matchesForTab.length>1?'s':''} disponible${matchesForTab.length>1?'s':''}. Lance l'analyse pour voir les value bets.`:'Consulte les onglets Coupe du Monde ou Amicaux.'}</div>
    </div>`:''}
    `}
  </div>

  <div class="footer">⚠️ Prédictions IA à titre informatif · Jouez responsable · ZeiikBet © 2026</div>

  ${showModal?`<div class="modal-bg"><div class="modal">
    <div style="text-align:center;font-size:36px">⚽</div>
    <div style="font-size:18px;font-weight:900;text-align:center">ZeiikBet</div>
    <div style="font-size:12px;color:var(--muted);text-align:center;line-height:1.5">Coupe du Monde 2026 · Amicaux<br/>Value Bets analysés par IA</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="step-item"><div class="step-num">1</div><div class="step-text">Va sur <a href="https://console.anthropic.com" target="_blank" style="color:#3b82f6">console.anthropic.com</a></div></div>
      <div class="step-item"><div class="step-num">2</div><div class="step-text">API Keys → Create Key → copie-la</div></div>
      <div class="step-item"><div class="step-num">3</div><div class="step-text">Colle ci-dessous — stockée uniquement sur ton appareil</div></div>
    </div>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..."/>
    <button class="modal-btn" id="saveKeyBtn">Démarrer →</button>
    <button class="modal-skip" id="skipBtn">Mode démo (sans clé)</button>
  </div></div>`:''}
  `;

  // Events
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>setState({tab:el.dataset.tab,results:[],expanded:null,filter:'all'})));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>setState({filter:el.dataset.filter})));
  document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.toggle);
    setState({expanded:state.expanded===id?null:id});
  }));
  const scanBtn=document.getElementById('scanBtn');
  if(scanBtn)scanBtn.addEventListener('click',()=>{
    localStorage.removeItem(CACHE_KEY+state.tab);
    localStorage.removeItem(CACHE_DATE+state.tab);
    runScan();
  });
  const saveBtn=document.getElementById('saveKeyBtn');
  if(saveBtn)saveBtn.addEventListener('click',()=>{
    const v=document.getElementById('apiKeyInput').value.trim();
    if(v){localStorage.setItem(ANTHROPIC_KEY,v);setState({key:v,showModal:false});}
  });
  const skipBtn=document.getElementById('skipBtn');
  if(skipBtn)skipBtn.addEventListener('click',()=>setState({showModal:false}));
}

render();
// Auto-load cache
['today','wc','friendly'].forEach(tab=>{
  const cached=localStorage.getItem(CACHE_KEY+tab);
  const date=localStorage.getItem(CACHE_DATE+tab);
  if(cached&&date===todayKey()&&tab===state.tab)setState({results:JSON.parse(cached)});
});
</script>
</body>
</html>
